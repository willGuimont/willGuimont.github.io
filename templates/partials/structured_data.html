{%- if current_path == "/" -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": {{ (config.base_url ~ "#website") | json_encode | safe }},
      "url": {{ config.base_url | json_encode | safe }},
      "name": {{ config.author | json_encode | safe }},
      "description": {{ config.extra.seo_home_description | json_encode | safe }},
      "publisher": { "@id": {{ (config.base_url ~ "#person") | json_encode | safe }} }
    },
    {
      "@type": "Person",
      "@id": {{ (config.base_url ~ "#person") | json_encode | safe }},
      "name": {{ config.author | json_encode | safe }},
      "url": {{ get_url(path="about/") | json_encode | safe }},
      "sameAs": [
        "https://github.com/willGuimont",
        "https://www.linkedin.com/in/william-guimont-martin/",
        "https://scholar.google.com/citations?user=sZIyj3IAAAAJ&hl=en"
      ]
    }
  ]
}
</script>
{%- elif page and current_path == "/about/" -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Person",
      "@id": {{ (config.base_url ~ "#person") | json_encode | safe }},
      "name": {{ page.extra.name | json_encode | safe }},
      "url": {{ page.permalink | json_encode | safe }},
      "description": {{ page.extra.intro | json_encode | safe }},
      "homeLocation": {{ page.extra.location | json_encode | safe }},
      "sameAs": [
        "https://github.com/willGuimont",
        "https://www.linkedin.com/in/william-guimont-martin/",
        "https://scholar.google.com/citations?user=sZIyj3IAAAAJ&hl=en"
      ]
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": {{ config.base_url | json_encode | safe }} },
        { "@type": "ListItem", "position": 2, "name": {{ page.title | json_encode | safe }}, "item": {{ page.permalink | json_encode | safe }} }
      ]
    }
  ]
}
</script>
{%- elif page and current_path is matching(pat="^/blog/") -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "BlogPosting",
      "headline": {{ page.title | json_encode | safe }},
      "description": {% if page.description %}{{ page.description | json_encode | safe }}{% else %}{{ ("Read “" ~ page.title ~ "” by " ~ config.author ~ ".") | json_encode | safe }}{% endif %},
      "url": {{ page.permalink | json_encode | safe }},
      "mainEntityOfPage": { "@type": "WebPage", "@id": {{ page.permalink | json_encode | safe }} },
      "datePublished": {{ page.date | date(format="%Y-%m-%d") | json_encode | safe }},
      "dateModified": {% if page.updated %}{{ page.updated | date(format="%Y-%m-%d") | json_encode | safe }}{% else %}{{ page.date | date(format="%Y-%m-%d") | json_encode | safe }}{% endif %},
      "author": { "@type": "Person", "@id": {{ (config.base_url ~ "#person") | json_encode | safe }}, "name": {{ config.author | json_encode | safe }} },
      "publisher": { "@type": "Person", "@id": {{ (config.base_url ~ "#person") | json_encode | safe }}, "name": {{ config.author | json_encode | safe }} }{% if page.extra?.banner %},
      "image": {{ (page.permalink ~ page.extra.banner) | json_encode | safe }}{% endif %}
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": {{ config.base_url | json_encode | safe }} },
        { "@type": "ListItem", "position": 2, "name": "Blog", "item": {{ get_url(path="blog/") | json_encode | safe }} },
        { "@type": "ListItem", "position": 3, "name": {{ page.title | json_encode | safe }}, "item": {{ page.permalink | json_encode | safe }} }
      ]
    }
  ]
}
</script>
{%- elif current_path and current_path != "/" -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Home", "item": {{ config.base_url | json_encode | safe }} },
    { "@type": "ListItem", "position": 2, "name": {% if page?.title %}{{ page.title | json_encode | safe }}{% elif term?.name %}{{ term.name | json_encode | safe }}{% elif taxonomy?.name %}{{ taxonomy.name | capitalize | json_encode | safe }}{% elif section?.extra?.seo_title %}{{ section.extra.seo_title | json_encode | safe }}{% else %}{{ section.title | default(value="Page") | json_encode | safe }}{% endif %}, "item": {{ current_url | json_encode | safe }} }
  ]
}
</script>
{%- endif -%}
