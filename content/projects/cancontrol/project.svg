<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">CanControl</title>
  <desc id="desc">An Arduino Uno-style board communicates with a white SPARK MAX-style motor controller over yellow CAN HIGH and green CAN LOW wires.</desc>
