<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">torch_waymo</title>
  <desc id="desc">A 2D bird eye view (BEV) lidar point-cloud scan with detected objects, feeding into PyTorch.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07151b"/><stop offset="1" stop-color="#102833"/></linearGradient>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#102630"/><stop offset="1" stop-color="#09161c"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#7bd7ff" stroke-opacity=".05"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dy="14" stdDeviation="14" flood-opacity=".35"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="810" fill="url(#bg)"/>
  <circle cx="1130" cy="-70" r="280" fill="#ff4b2b" opacity=".05"/><circle cx="115" cy="720" r="300" fill="#48d7b0" opacity=".045"/>
  <rect width="1440" height="810" fill="url(#grid)"/>
  <text x="84" y="110" fill="#66ccff" font-family="ui-monospace,monospace" font-size="27" font-weight="700" letter-spacing="6">AUTONOMOUS DRIVING DATA</text>
  <text x="84" y="188" fill="#f5f7f8" font-family="Georgia,serif" font-size="72">torch_waymo</text>

  <!-- 2D BEV Lidar Scan Panel -->
  <g transform="translate(70 245)" filter="url(#shadow)">
    <rect width="790" height="455" rx="28" fill="url(#panel)" stroke="#344b55" stroke-width="3"/>

    <!-- BEV Range Rings and Polar Grid (clamped within panel) -->
    <g stroke-linecap="round" fill="none">
      <circle cx="395" cy="227.5" r="60" stroke="#48d7b0" stroke-width="2" stroke-dasharray="3 7" opacity=".35"/>
      <circle cx="395" cy="227.5" r="120" stroke="#66ccff" stroke-width="2" stroke-dasharray="3 9" opacity=".3"/>
      <circle cx="395" cy="227.5" r="180" stroke="#48d7b0" stroke-width="2" stroke-dasharray="3 11" opacity=".22"/>
      <path d="M 65 227.5 H 725 M 395 35 V 420" stroke="#66ccff" stroke-width="1.5" stroke-dasharray="4 8" opacity=".2"/>
      <g font-family="ui-monospace,monospace" font-size="11" fill="#66ccff" opacity=".55">
        <text x="460" y="220">15m</text>
        <text x="520" y="220">30m</text>
        <text x="580" y="220">45m</text>
      </g>
    </g>

    <!-- 2D Point Cloud Road & Lane Markings (BEV Top-Down) -->
    <g fill="none" stroke-linecap="round" filter="url(#glow)">
      <!-- Left & Right Road Edge / Curb point cloud curves -->
      <path d="M 140 35 C 165 150 160 310 130 420" stroke="#66ccff" stroke-width="7" stroke-dasharray="1 14"/>
      <path d="M 650 35 C 625 140 630 310 660 420" stroke="#66ccff" stroke-width="7" stroke-dasharray="1 14"/>
      <!-- Lane divider point cloud lines -->
      <path d="M 395 35 V 140 M 395 315 V 420" stroke="#48d7b0" stroke-width="6" stroke-dasharray="1 13"/>
      <path d="M 265 35 C 275 160 270 310 250 420" stroke="#48d7b0" stroke-width="5" stroke-dasharray="1 15" opacity=".7"/>
      <path d="M 525 35 C 515 140 520 310 540 420" stroke="#48d7b0" stroke-width="5" stroke-dasharray="1 15" opacity=".7"/>

      <!-- Point Cloud Scan Rays / Sweeps from Ego Vehicle -->
      <g stroke="#66ccff" stroke-width="1.8" opacity=".2">
        <path d="M 395 227.5 L 395 85 M 395 227.5 L 240 115 M 395 227.5 L 530 105 M 395 227.5 L 150 195 M 395 227.5 L 640 185 M 395 227.5 L 230 335 M 395 227.5 L 560 325 M 395 227.5 L 490 160 M 395 227.5 L 310 165"/>
      </g>

      <!-- Obstacle 1: Lead Vehicle (Front, Orange 2D Bounding Box & Point Cloud) -->
      <g transform="translate(395 100)">
        <rect x="-24" y="-35" width="48" height="70" rx="6" stroke="#f1b56b" stroke-width="3" stroke-dasharray="6 3"/>
        <path d="M -24 -35 H 24 V 35 H -24 Z" stroke="#f1b56b" stroke-width="8" stroke-dasharray="1 11"/>
        <path d="M 0 -35 V -50" stroke="#f1b56b" stroke-width="3"/>
        <path d="M -5 -45 L 0 -53 L 5 -45" stroke="#f1b56b" stroke-width="3"/>
      </g>

      <!-- Obstacle 2: Front-Left Vehicle (Rotated -15 deg, Purple 2D Bounding Box & Point Cloud) -->
      <g transform="translate(235 120) rotate(-15)">
        <rect x="-22" y="-32" width="44" height="64" rx="6" stroke="#b889ff" stroke-width="3" stroke-dasharray="6 3"/>
        <path d="M -22 -32 H 22 V 32 H -22 Z" stroke="#b889ff" stroke-width="8" stroke-dasharray="1 11"/>
        <path d="M 0 -32 V -46" stroke="#b889ff" stroke-width="3"/>
        <path d="M -4 -40 L 0 -48 L 4 -40" stroke="#b889ff" stroke-width="3"/>
      </g>

      <!-- Obstacle 3: Rear-Right Vehicle (Rotated 12 deg, Orange 2D Bounding Box & Point Cloud) -->
      <g transform="translate(560 325) rotate(12)">
        <rect x="-22" y="-30" width="44" height="60" rx="6" stroke="#f1b56b" stroke-width="3" stroke-dasharray="6 3"/>
        <path d="M -22 -30 H 22 V 30 H -22 Z" stroke="#f1b56b" stroke-width="8" stroke-dasharray="1 11"/>
        <path d="M 0 -30 V -44" stroke="#f1b56b" stroke-width="3"/>
        <path d="M -4 -38 L 0 -46 L 4 -38" stroke="#f1b56b" stroke-width="3"/>
      </g>

      <!-- Obstacle 4: Pedestrian / Cyclist (Front-Right, Teal 2D Bounding Box & Point Cloud) -->
      <g transform="translate(490 160)">
        <circle cx="0" cy="0" r="16" stroke="#48d7b0" stroke-width="3" stroke-dasharray="4 3"/>
        <circle cx="0" cy="0" r="16" stroke="#48d7b0" stroke-width="8" stroke-dasharray="1 8"/>
        <path d="M 0 -16 V -26" stroke="#48d7b0" stroke-width="2.5"/>
      </g>
    </g>

    <!-- Top-Down Ego Vehicle (Center) -->
    <g transform="translate(395 227.5)">
      <!-- Lidar Scan Pulses -->
      <circle cx="0" cy="0" r="36" fill="none" stroke="#48d7b0" stroke-width="3" stroke-dasharray="2 6" opacity=".7"/>
      <circle cx="0" cy="0" r="50" fill="none" stroke="#66ccff" stroke-width="2" stroke-dasharray="2 8" opacity=".5"/>
      <!-- Ego Car Body (BEV 2D) -->
      <rect x="-20" y="-32" width="40" height="64" rx="8" fill="#0c1f28" stroke="#66ccff" stroke-width="3"/>
      <!-- Windshield & Roof lines -->
      <rect x="-14" y="-18" width="28" height="16" rx="4" fill="#184050" stroke="#48d7b0" stroke-width="1.5"/>
      <line x1="-14" y1="12" x2="14" y2="12" stroke="#344b55" stroke-width="2"/>
      <!-- Headlights / Tail lights -->
      <rect x="-17" y="-31" width="8" height="4" rx="1" fill="#66ccff"/>
      <rect x="9" y="-31" width="8" height="4" rx="1" fill="#66ccff"/>
      <rect x="-17" y="27" width="8" height="4" rx="1" fill="#ff4b2b"/>
      <rect x="9" y="27" width="8" height="4" rx="1" fill="#ff4b2b"/>
      <!-- Lidar Sensor Puck -->
      <circle cx="0" cy="-6" r="9" fill="#48d7b0" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="0" cy="-6" r="4" fill="#07151b"/>
    </g>
  </g>

  <!-- Flow Arrow -->
  <g transform="translate(885 472.5)" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M0 0h95" stroke="#66ccff" stroke-width="10"/>
    <path d="m65-30 32 30-32 30" stroke="#66ccff" stroke-width="10"/>
  </g>

  <!-- PyTorch Bracket and Torch Logo -->
  <g transform="translate(1010 245)" filter="url(#shadow)">
    <path d="M 85 40 H 30 V 415 H 85 M 235 40 H 290 V 415 H 235" fill="none" stroke="#ee4c2c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <image x="50" y="117.5" width="220" height="220" href="data:image/png;base64,"/>
  </g>
</svg>
