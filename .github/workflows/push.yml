name: Zola on GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/master'
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build only
        uses: shalzz/zola-deploy-action@v0.23.6
        env:
          BUILD_ONLY: true
          BUILD_FLAGS: --drafts
          # A GitHub token is not necessary when BUILD_ONLY is true
          # GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_and_deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2
      - name: Prepare IndexNow key file
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [[ -z "$INDEXNOW_KEY" ]]; then
            echo "INDEXNOW_KEY is not configured; skipping key file."
            exit 0
          fi
          if [[ ! "$INDEXNOW_KEY" =~ ^[A-Za-z0-9_-]{8,128}$ ]]; then
            echo "INDEXNOW_KEY has an invalid format" >&2
            exit 1
          fi
          printf '%s' "$INDEXNOW_KEY" > "static/${INDEXNOW_KEY}.txt"
      - name: Build and deploy
        uses: shalzz/zola-deploy-action@v0.23.6
        env:
          PAGES_BRANCH: gh-pages
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Submit changed URLs to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_BASE_SHA: ${{ github.event.before }}
        run: .github/scripts/submit-indexnow.sh
