<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">raylib_mojo</title>
  <desc id="desc">The official Mojo wordmark plus the raylib logo equals the raylib_mojo logo.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07151b"/><stop offset="1" stop-color="#172731"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#7bd7ff" stroke-opacity=".055"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dy="15" stdDeviation="14" flood-opacity=".35"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="810" fill="url(#bg)"/>
  <circle cx="60" cy="625" r="285" fill="#ff4c1f" opacity=".045"/><circle cx="1290" cy="85" r="245" fill="#66ccff" opacity=".045"/>
  <rect width="1440" height="810" fill="url(#grid)"/>
  <text x="90" y="115" fill="#66ccff" font-family="ui-monospace,monospace" font-size="28" font-weight="700" letter-spacing="7">GAME DEVELOPMENT / MOJO</text>
  <text x="90" y="190" fill="#f5f7f8" font-family="Georgia,serif" font-size="72">raylib_mojo</text>

  <g filter="url(#shadow)">
    <image x="70" y="352" width="315" height="116" href="data:image/svg+xml;base64,"/>
    <text x="228" y="620" fill="#9fb1b8" font-family="ui-monospace,monospace" font-size="18" text-anchor="middle">SYSTEMS LANGUAGE</text>
  </g>

  <g transform="translate(417 420)" stroke="#66ccff" stroke-width="12" stroke-linecap="round" filter="url(#glow)"><path d="M0 0h72M36-36v72"/></g>

  <g filter="url(#shadow)">
    <image x="520" y="286" width="270" height="270" href="data:image/png;base64,"/>
    <text x="655" y="620" fill="#9fb1b8" font-family="ui-monospace,monospace" font-size="18" text-anchor="middle">GAME LIBRARY</text>
  </g>

  <g transform="translate(835 420)" stroke="#66ccff" stroke-width="12" stroke-linecap="round" filter="url(#glow)"><path d="M0-20h76M0 20h76"/></g>

  <g filter="url(#shadow)">
    <image x="975" y="275" width="300" height="300" href="data:image/png;base64,"/>
    <text x="1125" y="620" fill="#9fb1b8" font-family="ui-monospace,monospace" font-size="18" text-anchor="middle">MOJO BINDINGS FOR RAYLIB</text>
  </g>
</svg>
