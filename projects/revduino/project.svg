<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Revduino</title>
  <desc id="desc">An Arduino-style board communicates with a REV Color Sensor V3 over I²C.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07151b"/><stop offset="1" stop-color="#102934"/></linearGradient>
    <linearGradient id="pcb" x2="1" y2="1"><stop stop-color="#1685a7"/><stop offset="1" stop-color="#0b526d"/></linearGradient>
    <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#e7edef"/><stop offset=".5" stop-color="#75858c"/><stop offset="1" stop-color="#cbd4d7"/></linearGradient>
    <linearGradient id="case" x2="1" y2="1"><stop stop-color="#2c3940"/><stop offset="1" stop-color="#10171b"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#7bd7ff" stroke-opacity=".06"/></pattern>
